<DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Falling Words</title>
            <link rel="stylesheet" href="style.css">
            <script src="script.js" defer></script>
        </head>
        <body>
            <main class="game">
                <header class="game-header">
                    <h1>FALLING WORDS</h1>
                </header>

                <d1 class="hud">
                    <div class="hud-item">
                        <dt>SCORE</dt>
                        <dd id="score">0</dd>
                    </div>
                    <div class="hud-item">
                        <dt>LIVES</dt>
                        <dd id="lives">3</dd>
                    </div>
                    <div class="hud-item">
                        <dt>COMBO</dt>
                        <dd id="combo">0</dd>

                    </div>
                </d1>
                </header>
    <section id="arena" aria-label="Gameplay arena"></section>
    <div id="start-screen">
        <button id="start-button" type="button">START GAME</button>
    </div>
</section>
  </main>
</body>
</html>
